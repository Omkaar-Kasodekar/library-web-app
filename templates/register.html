{% extends "base.html" %}
{% block content %}

<h2>Register</h2>

<form method="post">
    <label>Username:</label><br>
    <input type="text" name="username"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password"><br><br>

    <button type="submit">Register</button>
</form>

<p>
    Already registered?
    <a href="{{ url_for('auth.login') }}">Login</a>
</p>

{% endblock %}
