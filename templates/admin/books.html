{% extends "base.html" %}
{% block content %}

<h2>All Books</h2>

<h3>Add New Book</h3>
<form method="post" action="{{ url_for('admin.books') }}">
    <label>Title:</label><br>
    <input type="text" name="title"><br><br>

    <label>Author:</label><br>
    <input type="text" name="author"><br><br>

    <button type="submit">Add Book</button>
</form>

<hr>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ "Available" if book.available == 1 else "Issued" }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
